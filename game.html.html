<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameGen - Find Your Cheat Code</title>
    <!-- Importing Google Fonts for that "Gamer" look -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS STYLES --- */
        :root {
            --primary-color: #00ffea; /* Neon Cyan */
            --secondary-color: #ff0055; /* Neon Pink */
            --bg-color: #0b0c15;
            --card-bg: #161829;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1a1d2e 0%, #0b0c15 100%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated Background Grid */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 234, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 234, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); }
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 800px;
            z-index: 1;
            padding: 20px;
        }

        /* Logo / Header */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--primary-color);
        }

        h1 span {
            color: var(--secondary-color);
            text-shadow: 0 0 20px var(--secondary-color);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 40px;
        }

        /* Search Box Styling */
        .search-box {
            background: rgba(22, 24, 41, 0.8);
            padding: 10px;
            border-radius: 50px;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 255, 234, 0.3);
            display: flex;
            flex-wrap: wrap;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .search-box:focus-within {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 255, 234, 0.5);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.2rem;
            padding: 15px 25px;
            outline: none;
            font-family: 'Roboto', sans-serif;
        }

        /* Custom Select Dropdown */
        .engine-select {
            background: transparent;
            color: var(--primary-color);
            border: none;
            border-left: 1px solid #333;
            padding: 0 15px;
            outline: none;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }

        button.search-btn {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 15px 40px;
            border-radius: 40px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button.search-btn:hover {
            background: white;
            box-shadow: 0 0 20px white;
        }

        /* Quick Links Section */
        .quick-links {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 20px;
            color: #ccc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            cursor: pointer;
        }

        .chip:hover {
            background: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
            box-shadow: 0 0 15px var(--secondary-color);
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .search-box { border-radius: 15px; flex-direction: column; }
            input[type="text"] { border-bottom: 1px solid #333; text-align: center; }
            .engine-select { padding: 10px; border-left: none; border-top: 1px solid #333; }
            button.search-btn { width: 100%; margin-top: 10px; border-radius: 10px; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="container">
        <h1>Game<span>Gen</span></h1>
        <p class="subtitle">Level Up Your Gameplay. Search Guides, Builds & Tips.</p>

        <form id="searchForm" class="search-box">
            <!-- Search Engine Selector -->
            <select id="searchEngine" class="engine-select" onchange="updatePlaceholder()">
                <option value="youtube">YouTube (Video)</option>
                <option value="google">Google (Wiki/Tips)</option>
            </select>

            <!-- Search Input -->
            <input type="text" id="searchInput" placeholder="e.g. Elden Ring Boss Guide" required autocomplete="off">

            <!-- Submit Button -->
            <button type="submit" class="search-btn">Search</button>
        </form>

        <!-- Quick Category Links -->
        <div class="quick-links">
            <a class="chip" onclick="quickSearch('Fortnite')">Fortnite</a>
            <a class="chip" onclick="quickSearch('Minecraft')">Minecraft</a>
            <a class="chip" onclick="quickSearch('Valorant')">Valorant</a>
            <a class="chip" onclick="quickSearch('Elden Ring')">Elden Ring</a>
            <a class="chip" onclick="quickSearch('League of Legends')">LoL</a>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT FUNCTIONALITY ---

        const form = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const engineSelect = document.getElementById('searchEngine');

        // Function to handle the actual search submission
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page from reloading
            const query = searchInput.value;
            const engine = engineSelect.value;

            if(query.trim() === "") return;

            if (engine === 'youtube') {
                // Redirect to YouTube Search
                window.location.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(query + " gameplay tips")}`;
            } else {
                // Redirect to Google Search
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query + " gaming tips")}`;
            }
        });

        // Helper to update placeholder text based on dropdown
        function updatePlaceholder() {
            const engine = engineSelect.value;
            if (engine === 'youtube') {
                searchInput.placeholder = "Search Video Guides...";
            } else {
                searchInput.placeholder = "Search Articles/Wikis...";
            }
        }

        // Helper for the quick link chips
        function quickSearch(term) {
            searchInput.value = term;
            
            // Trigger the form submission logic manually
            const event = new Event('submit');
            // Temporarily force the engine based on what makes sense, or keep current
            // Here we just simulate a submit
            form.dispatchEvent(new Event('submit'));
        }

        // Initialize placeholder
        updatePlaceholder();
    </script>
</body>
</html>
